# Checks formatting, vet and tests, and runs serve in Docker, on every pull
# request and push to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # A fixed Ubuntu release, so a new runner image cannot change the checks
    # until this line changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the Go version in go.mod. The module's one dependency,
      # golang.org/x/sync, is small, so there is nothing worth caching.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::run gofmt -w on these files: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh test/container/run.sh
