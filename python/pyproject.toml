[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurokit-broker"
version = "0.1.0.dev0"
description = "Write a neurokit tool's commands as Python functions."
license = "MIT"
requires-python = ">=3.12"
# A range, so the calling app and each tool image can keep the pydantic 2
# they already have.
dependencies = ["pydantic>=2.11.9,<3"]

[tool.setuptools]
packages = ["neurokit"]

[tool.setuptools.package-data]
neurokit = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 79
